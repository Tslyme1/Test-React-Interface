name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/react-components-rewrite-fcfr3e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Полный набор проверок живёт в checks.yml и гоняется на тот же push.
  # Здесь дублируются только типы и линтер: они дёшевы, а выкладывать
  # заведомо сломанную сборку не стоит даже ради скорости.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm run ds:lint
      - run: npx vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
