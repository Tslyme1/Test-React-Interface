  printStep(variant) {

  // ---------- field builders ----------

  numField(variant, section, key, label, symbol, unit) {
    const data = this.state[variant].data;

    const hint = this.glossaryHint(symbol);
    const delta = this.fieldDelta(variant, section, key, raw);
    if (unit === 'рад') {
      const deg = this.state[variant].angleUnit === 'deg';
      const value = deg ? Math.round(raw * 180 / Math.PI * 1000) / 1000 : raw;
      return {
        kind: 'num', key: section + '.' + key, label, symbol, unit: deg ? '°' : 'рад', value, hint, delta, variant,
        onChange: (e) => this.setPath(variant, section, key, deg ? this.num(e.target.value) * Math.PI / 180 : this.num(e.target.value))
      };
    }
    return { kind: 'num', key: section + '.' + key, label, symbol, unit, value: raw, hint, delta, variant, onChange: (e) => this.setPath(variant, section, key, this.num(e.target.value)) };
  }
  mmField(variant, section, key, label, symbol) {
    const raw = this.state[variant].data[section][key];

      delta: this.fieldDelta(variant, section, key, raw), variant,

  }
  fieldDelta(variant, section, key, current) {
    if (section === 'geom') {

    const reducedAngle = Math.round(((d.beta10 + d.beta2 + d.beta40) / 3) * 1000) / 1000;
    const calibrationRatio = Math.round((d.l2 / (d.l11 + (d.l12 || 0) + d.l2)) * 1000) / 10;
    const alphaAuto = d.alphaValues.length === 0;
    return [
      { label: 'Приведённый угол дробления', value: reducedAngle + ' рад' },
      { label: 'Объём камеры дробления', value: chamberVolume + ' м³' },

  computeGranSummary(variant) {
    const d = this.state[variant].data.gran;
    const sectors = (d.selectedSectors || '').split(',').map(s => s.trim()).filter(Boolean);
    const rows = sectors.length ? sectors : ['5', '10'];
    return rows.map((sec, i) => {
      const base = 10 + i * 6 + this.num(sec) * 0.3;
      return {
        sector: 'Сектор ' + sec,
        dmax: Math.round((d.Dmax - i * 4) * 10) / 10,
        gamma: Math.round((base % 40 + 20) * 10) / 10,
        wq: Math.round((d.qClasses ? 100 / d.qClasses * (i + 1) : 8) * 10) / 10
      };
    });
  }

  computeResults(variant) {
    const d = this.state[variant].data;
    const bounds = d.prod.classBoundaries;
    const total = bounds.reduce((a, b) => a + (b[1] - b[0] > 0 ? b[1] - b[0] : 1), 0) || 1;
    const rows = bounds.map((b) => {
      const width = Math.max(1, b[1] - b[0]);
      const yield_ = Math.round((width / total) * (60 + d.prod.kpd * 10) * 10) / 10;
      return { cls: b[0] + '–' + b[1] + ' мм', yield: yield_ };
    });
    const usedYield = rows.reduce((a, r) => a + r.yield, 0);
    rows.push({ cls: '< ' + (bounds[0] ? bounds[0][0] : 5) + ' мм', yield: Math.max(0, Math.round((100 - usedYield) * 10) / 10) });

    const forces = [
      { zone: 'Зона входа', beta: d.geom.beta10, force: Math.round((d.gran.b1 || 0.08) * d.geom.D * 600) },
      { zone: 'Зона дробления', beta: d.geom.beta11, force: Math.round((d.gran.b2 || 1.5) * d.geom.D * 400) },
      { zone: 'Зона калибровки', beta: d.geom.beta2, force: Math.round(((d.gran.b3 || 0.5) + 0.2) * d.geom.D * 300) }
    ];

    const points = rows.map((r, i) => [i / (rows.length - 1 || 1), r.yield / 100]).reverse();
    return { rows, forces, points, name: d.meta.name, variant: d.meta.variant };
  }

      return { label: fmtLabel(i, b), x: upper, minus, plus: +(100 - minus).toFixed(1) };
    });

    const curve = Array.from({ length: SAMPLES + 1 }, (_, i) => {
      const x = xMax * i / SAMPLES;
      const minus = +passAt(x).toFixed(1);
      return { x, minus, plus: +(100 - minus).toFixed(1) };
    });
    const mode = st.prodClassMode || 'minus';
    const chartRows = classPoints.map(p => ({ label: p.label, value: mode === 'plus' ? p.plus : p.minus }));
