name: Проверки

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Прогон на ветке имеет смысл только для последнего коммита: промежуточные
# результаты всё равно никто не читает.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Типы
        run: npm run typecheck

      - name: Дизайн-система — линтер
        run: npm run ds:lint

      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      # Отчёт нужен именно когда красное — по нему разбирают падение,
      # не воспроизводя его локально.
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Снимки экранов
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort &
          until curl -sS -o /dev/null --max-time 2 http://127.0.0.1:5173/; do sleep 1; done
          npm run screens

      - name: Выложить снимки
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-review
          path: screenshots-review/
          retention-days: 7
